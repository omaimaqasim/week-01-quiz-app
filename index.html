<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartQuiz 4-Option Game</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Title -->
  <h1>🧠 SmartQuiz</h1>

  <!-- Quiz Box -->
  <div class="quiz_box" style="display: block;">
    
    <!-- Status bar -->
    <div class="statusbar">
      <div class="scorebox"></div>
      <div class="progress">
        <div class="progressbar"></div>
      </div>
    </div>

    <!-- Question -->
    <div class="quiz">
      Question
    </div>

    <!-- Options -->
    <div class="quizoptions">
      <div class="sec1">
        <button class="option1">option1</button>
        <button class="option2">option2</button>
      </div>
      <div class="sec2">
        <button class="option3">option3</button>
        <button class="option4">option4</button>
      </div>
    </div>

    <!-- Next Button -->
    <div class="next_div">
      <button class="next">Next</button>
    </div>

  </div>

  <!-- Result Box -->
  <div class="result_box" style="display: none;">
    <h2>🎉 Quiz Completed!</h2>
    <div class="result"></div>
    <div class="result_message"></div>
    <button onclick="restartQuiz()">Restart Quiz</button>
  </div>

  <!-- Script -->
  <script src="script/script.js"></script>

</body>
</html>
